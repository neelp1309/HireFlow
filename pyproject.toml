[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hireflow-ml"
version = "1.0.0"
description = "Recruiter-facing candidate intelligence using semantic retrieval, hybrid ranking, offline evaluation, and grounded LLM reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "HireFlow Project"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faiss.*", "streamlit.*", "prometheus_client.*"]
ignore_missing_imports = true

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.9,<2"]
