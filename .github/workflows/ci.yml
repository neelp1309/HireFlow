name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q src app scripts
      - name: Unit and integration tests
        env:
          APP_ENV: test
          PYTHONPATH: src
        run: pytest --cov=hireflow --cov-report=term-missing
      - name: Public demo smoke test
        env:
          APP_ENV: test
          PYTHONPATH: src
        run: python scripts/demo_structured_search.py
      - name: Release hygiene validation
        env:
          APP_ENV: test
          PYTHONPATH: src
        run: python scripts/validate_release.py
      - name: Ruff critical checks
        run: ruff check src tests scripts app --select E9,F63,F7,F82

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hireflow:ci
