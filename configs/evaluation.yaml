benchmark:
  job_id: senior_accountant_001
  relevant_threshold: 2
  label_scale:
    0: not_suitable
    1: weak_fit
    2: moderate_fit
    3: strong_fit

metrics:
  k_values: [5, 10, 20]
  primary_metric: ndcg_at_10
  secondary_metrics:
    - strong_fit_rate_at_5
    - strong_fit_rate_at_10
    - precision_at_10
    - recall_at_10
    - average_precision

notes:
  - "This benchmark contains one JD, so results are descriptive rather than a generalization estimate."
  - "The project-authored labels are a silver benchmark and should be independently human-reviewed before claiming production validity."
  - "Do not tune hybrid weights solely against this single benchmark; doing so would overfit the one-job evaluation set."
